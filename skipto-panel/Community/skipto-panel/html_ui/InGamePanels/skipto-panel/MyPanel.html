<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/SCSS/common.css" />
    <link rel="stylesheet" href="/templates/virtualScroll/virtualScroll.css">

    <script type="text/javascript" src="/JS/coherent.js"></script>
    <script type="text/javascript" src="/JS/common.js"></script>
    <script type="text/javascript" src="/JS/dataStorage.js"></script>
    <script type="text/javascript" src="/JS/buttons.js"></script>
    <script type="text/javascript" src="/JS/simvar.js"></script>
    <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>

    <link rel="import" href="/templates/ingameUi/ingameUi.html" />
    <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
    <link rel="import" href="/templates/checkbox/checkbox.html" />
    <link rel="import" href="/templates/NewPushButton/NewPushButton.html" />
    <link rel="import" href="/templates/ToggleButton/ToggleButton.html" />
    <link rel="import" href="/templates/tabMenu/tabMenu.html" />
    <link rel="import" href="/templates/NewListButton/NewListButton.html" />
    <link rel="import" href="/templates/toggleButton/toggleButton.html" />

    <script type="text/javascript" src="/Pages/VCockpit/Instruments/Shared/BaseInstrument.js"></script>
    <script type="text/javascript" src="/JS/debug.js"></script>

    <link rel="stylesheet" href="./MyPanel.css" />
    <script defer="defer" type="text/javascript" src="./SimBriefConfig.js"></script>
    <script defer="defer" type="text/javascript" src="./GeoMath.js"></script>
    <script defer="defer" type="text/javascript" src="./MyPanel.js"></script>
</head>

<body id="my-panel" class="border-box">
    <my-panel>
        <ingame-ui id="my-panel-frame"
            panel-id="{project-id}"
            class="ingameUiFrame panelInvisible"
            title="{project-title}"
            content-fit="false"
            min-width="30"
            min-height="10">
            <section id="MainDisplay">
                <div class="panel-header">
                    <div class="panel-title">Skip to Waypoint</div>
                    <div id="flightplan-status" class="flightplan-status">Checking...</div>
                </div>

                <div class="manual-lookup-group">
                    <label for="manual-waypoint-input" class="select-label">SimBrief Pilot ID or username</label>
                    <div class="manual-lookup-controls">
                        <input id="manual-waypoint-input" type="text" placeholder="Pilot ID or username" />
                        <button id="btnLookup" class="panel-btn" type="button">Fetch flightplan</button>
                    </div>
                </div>

                <div class="waypoint-card">
                    <div class="waypoint-label">Next fix</div>
                    <div id="next-fix-ident" class="waypoint-ident">--</div>
                    <div id="next-fix-type" class="waypoint-type">Waypoint</div>
                </div>

                <div class="coord-grid next-fix-grid">
                    <div class="coord-item">
                        <span>Lat</span>
                        <strong id="next-fix-lat">--</strong>
                    </div>
                    <div class="coord-item">
                        <span>Lon</span>
                        <strong id="next-fix-lon">--</strong>
                    </div>
                    <div class="coord-item">
                        <span>Dist</span>
                        <strong id="next-fix-distance">--</strong>
                    </div>
                    <div class="coord-item">
                        <span>Hdg</span>
                        <strong id="next-fix-heading">--</strong>
                    </div>
                </div>

                <div class="selector-group">
                    <new-list-button id="waypoint-select" title="SELECT FIX #00" class="inList" loop="false"></new-list-button>
                </div>

                <div class="coord-grid select-fix-grid">
                    <div class="coord-item">
                        <span>Lat</span>
                        <strong id="select-fix-lat">--</strong>
                    </div>
                    <div class="coord-item">
                        <span>Lon</span>
                        <strong id="select-fix-lon">--</strong>
                    </div>
                </div>

                <div class="controls">
                    <button id="btnTeleport" class="panel-btn primary" type="button">Teleport to selected</button>
                    <button id="btnRefresh" class="panel-btn" type="button">Refresh</button>
                </div>

                <toggle-button id="set-fuel-on-teleport" class="panel-toggle condensed-interactive" title="Set fuel on teleport (experimental)" full-line-select></toggle-button>

                <toggle-button id="teleport-before-fix" class="panel-toggle condensed-interactive" title="Teleport before fix" defaultValue="true" full-line-select></toggle-button>

                <toggle-button id="auto-update" class="panel-toggle condensed-interactive" title="Auto-update every 10 seconds" full-line-select></toggle-button>

                <div class="debug-group">
                    <label id="debug-log-label" for="txt-debug-log">Debug Log:</label>
                    <textarea id="txt-debug-log" readonly>Initializing...</textarea>
                </div>

                <div class="creditline">v1.0.0 © 2026 steffieth</div>
            </section>
        </ingame-ui>
    </my-panel>
</body>
</html>
